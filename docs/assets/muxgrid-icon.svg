<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Outer tile clip -->
    <clipPath id="tile-clip">
      <rect x="4" y="4" width="504" height="504" rx="112" />
    </clipPath>

    <!-- Row 3 active playhead card clip -->
    <clipPath id="row3-active-clip">
      <rect x="144" y="358" width="164" height="58" rx="14" />
    </clipPath>

    <!-- Tile surface & hairline border -->
    <linearGradient id="tile-bg" x1="48" y1="24" x2="464" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272D3A" />
      <stop offset="50%" stop-color="#1B1F2A" />
      <stop offset="100%" stop-color="#11141C" />
    </linearGradient>

    <linearGradient id="tile-border" x1="256" y1="4" x2="256" y2="508" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Coral red accents & radial glows (VectorDrawable-friendly, no feGaussianBlur) -->
    <radialGradient id="rec-dot-glow" cx="396" cy="116" r="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0.46" />
      <stop offset="45%" stop-color="#FF453A" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rec-dot-fill" x1="364" y1="84" x2="428" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF695A" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>

    <radialGradient id="small-rec-glow" cx="91" cy="240" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="row3-coral-sweep" x1="210" y1="387" x2="308" y2="387" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0" />
      <stop offset="75%" stop-color="#FF453A" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0.52" />
    </linearGradient>

    <radialGradient id="bottom-bar-glow" cx="292" cy="446" r="96" gradientTransform="translate(0 335) scale(1 0.25)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FF453A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bottom-bar-fill" x1="216" y1="446" x2="368" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#FF7262" />
    </linearGradient>

    <radialGradient id="blue-accent-glow" cx="91" cy="446" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Tile Base -->
  <g clip-path="url(#tile-clip)">
    <rect x="4" y="4" width="504" height="504" rx="112" fill="url(#tile-bg)" />

    <!-- Top-Right Coral Recording Dot & Ambient Glow (concentric with corner arc) -->
    <circle cx="396" cy="116" r="108" fill="url(#rec-dot-glow)" />
    <circle cx="396" cy="116" r="39" fill="url(#rec-dot-fill)" />

    <!-- Timeline Header Markers -->
    <g fill="#737D90" opacity="0.85">
      <rect x="148" y="185" width="44" height="7" rx="3.5" />
      <rect x="284" y="185" width="44" height="7" rx="3.5" />
      <rect x="418" y="185" width="38" height="7" rx="3.5" />
    </g>

    <!-- ROW 1: Active Recording & DVR Ruler -->
    <g>
      <!-- Left Status Cell -->
      <rect x="52" y="208" width="78" height="64" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" />
      <circle cx="91" cy="240" r="28" fill="url(#small-rec-glow)" />
      <circle cx="91" cy="240" r="11" fill="#FF453A" />

      <!-- Center Ruler Card -->
      <rect x="144" y="208" width="256" height="64" rx="14" fill="#293040" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />
      <rect x="162" y="224" width="96" height="9" rx="4.5" fill="#A6B0C2" />

      <!-- Ruler Ticks -->
      <g stroke-linecap="round">
        <!-- Minor ticks -->
        <path d="M164 257v-6 M176 257v-6 M200 257v-6 M212 257v-6 M224 257v-6 M260 257v-6 M272 257v-6 M296 257v-6 M308 257v-6 M344 257v-6 M356 257v-6 M368 257v-6"
              stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" />
        <!-- Medium ticks -->
        <path d="M188 257v-11 M236 257v-11 M284 257v-13 M332 257v-11 M380 257v-11"
              stroke="#CBD5E1" stroke-opacity="0.65" stroke-width="2" />
        <!-- Active playhead tick -->
        <line x1="248" y1="238" x2="248" y2="257" stroke="#F8FAFC" stroke-width="2.5" />
      </g>

      <!-- Coral Timeline Baseline -->
      <line x1="158" y1="258" x2="386" y2="258" stroke="#FF453A" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
      <line x1="214" y1="258" x2="386" y2="258" stroke="#FF453A" stroke-width="3" stroke-linecap="round" />

      <!-- Right Edge Cell -->
      <rect x="414" y="208" width="46" height="64" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
      <rect x="425" y="224" width="24" height="9" rx="4.5" fill="#7D8799" />
      <path d="M428 257v-6 M437 257v-6 M446 257v-6" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- ROW 2: Program Slots -->
    <g>
      <rect x="52" y="286" width="78" height="58" rx="14" fill="#1E2330" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5" />

      <rect x="144" y="286" width="224" height="58" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
      <rect x="162" y="310" width="98" height="10" rx="5" fill="#7D8799" />

      <rect x="382" y="286" width="78" height="58" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
      <rect x="398" y="310" width="46" height="10" rx="5" fill="#7D8799" />
    </g>

    <!-- ROW 3: Now Playhead & Next Slot -->
    <g>
      <rect x="52" y="358" width="78" height="58" rx="14" fill="#1E2330" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5" />

      <!-- Active Slot with Coral Glow & Now Hairline -->
      <rect x="144" y="358" width="164" height="58" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5" />
      <g clip-path="url(#row3-active-clip)">
        <rect x="210" y="358" width="98" height="58" fill="url(#row3-coral-sweep)" />
        <rect x="303" y="361" width="4" height="52" rx="2" fill="#FF5442" />
      </g>
      <rect x="162" y="382" width="84" height="10" rx="5" fill="#8A94A6" />

      <!-- Upcoming Slot -->
      <rect x="322" y="358" width="138" height="58" rx="14" fill="#232937" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
      <rect x="340" y="382" width="102" height="10" rx="5" fill="#8A94A6" />
    </g>

    <!-- Bottom Status & Scrub Progress Bar -->
    <g>
      <!-- Subtle Cool-Blue Indicator -->
      <circle cx="91" cy="446" r="26" fill="url(#blue-accent-glow)" />
      <path d="M87 441a7 7 0 0 0 8 9" stroke="#93C5FD" stroke-width="3.2" stroke-linecap="round" />

      <!-- Track & Active Coral Segment -->
      <rect x="144" y="441" width="304" height="10" rx="5" fill="#1E2330" />
      <ellipse cx="292" cy="446" rx="96" ry="24" fill="url(#bottom-bar-glow)" />
      <rect x="216" y="441" width="152" height="10" rx="5" fill="url(#bottom-bar-fill)" />
    </g>
  </g>

  <!-- Crisp Outer Hairline Stroke -->
  <rect x="4" y="4" width="504" height="504" rx="112" stroke="url(#tile-border)" stroke-width="2" />
</svg>
